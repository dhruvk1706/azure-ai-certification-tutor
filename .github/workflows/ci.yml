name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tutor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d tutor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - run: uv run ruff check . ../tests/backend
      - run: uv run ruff format --check . ../tests/backend
      - run: uv run mypy
      # The real migrations on Postgres; the tests never touch DATABASE_URL.
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/tutor_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check -w frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infrastructure/docker-compose.yml build
